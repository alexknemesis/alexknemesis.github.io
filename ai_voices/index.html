<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo de Voces AI</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f8f9fa;
        }
        .container {
            max-width: 700px;
            margin: 40px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            padding: 32px 16px;
        }
        h1, h2 {
            text-align: center;
            color: #333;
        }
        .voice-list {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-bottom: 32px;
        }
        .voice-item {
            border-radius: 8px;
            padding: 16px;
            width: 220px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .voice-item.femenina {
            background: #ffe4ec; /* rosa salmón muy suave */
        }
        .voice-item.masculina {
            background: #e3f0ff; /* azul muy suave */
        }
        .voice-label {
            margin-bottom: 10px;
            font-weight: 500;
            color: #222;
        }
        audio {
            width: 100%;
            outline: none;
        }
        @media (max-width: 600px) {
            .container {
                padding: 10px 2px;
            }
            .voice-item {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Demo de Voces AI</h1>
        <h2>Voces Femeninas</h2>
        <div class="voice-list">

    <script>
        // Permitir solo un audio a la vez
        document.addEventListener('DOMContentLoaded', function() {
            const audios = document.querySelectorAll('audio');
            audios.forEach(audio => {
                audio.addEventListener('play', function() {
                    audios.forEach(other => {
                        if (other !== audio) {
                            other.pause();
                            other.currentTime = 0;
                        }
                    });
                });
            });
        });
    </script>
